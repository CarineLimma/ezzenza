
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Essenza</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <main class="login-container">
        <img
            src="{{ url_for('static', filename='img/img.png') }}"
            alt=""
            class="login-illustration"
            aria-hidden="true"
        >

        <section class="login-card">
            <div class="login-header">
                <span class="logo-icon">✦</span>
                <h1>ESSENZA</h1>
                <p>Bem-vinda de volta!</p>
                <span>Acesse seu painel de gerenciamento</span>
            </div>

            <form action="{{ url_for('login') }}" method="POST" class="login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            id="toggleSenha"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="{{ url_for('esqueci_senha') }}">Esqueceu sua senha?</a>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <div class="login-footer">
                <p>
                    Ainda não possui acesso?
                    <a href="{{ url_for('cadastro') }}">Criar conta</a>
                </p>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
