<div id="appointmentModal"
     class="appointment-modal"
     role="presentation"
     hidden>

    <section class="appointment-modal-card"
             role="dialog"
             aria-modal="true"
             aria-labelledby="appointmentModalTitle">

        <div class="appointment-modal-header">

            <div>
                <p class="small-text">Gestão de atendimentos</p>
                <h2 id="appointmentModalTitle">
                    Novo agendamento
                </h2>
                <p>Preencha os dados do atendimento.</p>
            </div>

            <button type="button"
                    id="closeAppointment"
                    aria-label="Fechar formulário">
                &times;
            </button>

        </div>

        <form id="appointmentForm">

            <div class="appointment-form-group">
                <label for="appointmentClient">
                    Nome da cliente
                </label>

                <input type="text"
                       id="appointmentClient"
                       name="cliente_nome"
                       placeholder="Nome completo da cliente"
                       autocomplete="name"
                       required>
            </div>

            <div class="appointment-form-group">
                <label for="appointmentPhone">
                    WhatsApp
                </label>

                <input type="tel"
                       id="appointmentPhone"
                       name="telefone"
                       placeholder="(47) 99999-9999"
                       autocomplete="tel"
                       required>
            </div>

            <div class="appointment-form-group">
                <label for="appointmentProcedure">
                    Procedimento
                </label>

                <input type="text"
                       id="appointmentProcedure"
                       name="procedimento"
                       placeholder="Ex.: Limpeza de pele"
                       required>
            </div>

            <div class="appointment-form-row">

                <div class="appointment-form-group">
                    <label for="appointmentDate">Data</label>

                    <input type="date"
                           id="appointmentDate"
                           name="data"
                           required>
                </div>

                <div class="appointment-form-group">
                    <label for="appointmentTime">Horário</label>

                    <input type="time"
                           id="appointmentTime"
                           name="horario"
                           required>
                </div>

            </div>

            <div class="appointment-form-row">

                <div class="appointment-form-group">
                    <label for="appointmentDuration">
                        Duração (min)
                    </label>

                    <input type="number"
                           id="appointmentDuration"
                           name="duracao"
                           min="1"
                           value="60"
                           required>
                </div>

                <div class="appointment-form-group">
                    <label for="appointmentValue">
                        Valor (R$)
                    </label>

                    <input type="number"
                           id="appointmentValue"
                           name="valor"
                           min="0"
                           step="0.01"
                           placeholder="0,00"
                           required>
                </div>

            </div>

            <div class="appointment-form-group">
                <label for="appointmentStatus">
                    Status inicial
                </label>

                <select id="appointmentStatus"
                        name="status">

                    <option value="pending" selected>
                        Pendente
                    </option>

                    <option value="confirmed">
                        Confirmado
                    </option>

                </select>
            </div>

            <div class="appointment-modal-actions">

                <button type="button"
                        id="cancelAppointment"
                        class="btn-cancel">
                    Cancelar
                </button>

                <button type="submit"
                        class="save-button">
                    Salvar agendamento
                </button>

            </div>

        </form>

    </section>

</div>
